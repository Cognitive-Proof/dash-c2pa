[package]
name = "dash-c2pa"
description = "C2PA verification of fragmented MP4 DASH segments in the browser, for dash.js"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.96"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
c2pa = { version = "0.91", default-features = false, features = ["rust_native_crypto"] }
serde-wasm-bindgen = "0.6"
serde = { version = "1", features = ["derive"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# Rust >= 1.82 emits these wasm features by default; wasm-pack's bundled
# wasm-opt rejects the module unless they are enabled explicitly.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-Oz",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
    "--enable-sign-ext",
    "--enable-mutable-globals",
    "--enable-reference-types",
    "--enable-multivalue",
]

[dev-dependencies]
anyhow = "1"
c2pa = { version = "0.91", default-features = false, features = ["rust_native_crypto", "file_io"] }
serde_json = "1"
